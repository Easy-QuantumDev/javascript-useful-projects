<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <main class="app">

        <!-- Header -->

        <header class="header">

            <div>
                <p class="eyebrow">WEATHER APP</p>

                <h1>Weather today.</h1>

                <p class="subtitle">
                    Check the weather anywhere in the world.
                </p>
            </div>

            <div class="header-icon">
                <i class="fa-solid fa-cloud-sun"></i>
            </div>

        </header>


        <!-- Search -->

        <section class="search-section">

            <div class="search-box">

                <i class="fa-solid fa-location-dot location-icon"></i>

                <input type="text" id="city-input" placeholder="Search for a city..." autocomplete="off">

                <button id="search-btn">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    Search
                </button>

            </div>

            <p id="error-message" class="error-message"></p>
            <p id="loading">loading weather</p>
        </section>


        <!-- Weather Card -->

        <section class="weather-card">

            <div class="weather-top">

                <div>

                    <p class="location-label">
                        CURRENT WEATHER
                    </p>

                    <h2 id="city-name">
                        your city
                    </h2>

                    <p id="weather-description">
                        Clear sky
                    </p>

                </div>

                <div class="weather-icon">
                    <i class="fa-solid fa-sun"></i>
                </div>

            </div>


            <div class="temperature">

                <span id="temperature">
                    
                </span>

                <span class="degree">
                    °C
                </span>

            </div>


            <div class="weather-info">

                <div class="info-item">

                    <div class="info-icon humidity">
                        <i class="fa-solid fa-droplet"></i>
                    </div>

                    <div>
                        <span>Humidity</span>
                        <strong id="humidity"></strong>
                    </div>

                </div>


                <div class="info-item">

                    <div class="info-icon wind">
                        <i class="fa-solid fa-wind"></i>
                    </div>

                    <div>
                        <span>Wind</span>
                        <strong id="wind"></strong>
                    </div>

                </div>


                <div class="info-item">

                    <div class="info-icon feels">
                        <i class="fa-solid fa-temperature-half"></i>
                    </div>

                    <div>
                        <span>Feels like</span>
                        <strong id="feels-like"></strong>
                    </div>

                </div>

            </div>

        </section>


        <!-- Forecast -->
        <!-- Forecast -->

        <section class="forecast-section">

            <div class="section-title">

                <div>
                    <p class="eyebrow">FORECAST</p>
                    <h3>Next days</h3>
                </div>

                <button id="unit-btn">
                    °C / °F
                </button>

            </div>

            <div class="forecast" id="forecast">

            </div>

        </section>

        <!-- Footer -->

        <footer class="footer">

            <span>
                Weather App
            </span>

            <span>
                Powered by JavaScript
            </span>

        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
